name: Build Nokia XG-040G-MD with OpenClash

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with the firmware image"
        required: false
        type: boolean
        default: true
  push:
    paths:
      - 'build-trigger/xg040g-md-openclash'

permissions:
  contents: write

concurrency:
  group: build-xg040g-md-oc
  cancel-in-progress: true

jobs:
  build:
    name: Build nokia_xg-040g-md-ubi + OpenClash
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch OpenClash package (sparse)
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/vernesong/OpenClash.git oc-src
          cd oc-src
          git sparse-checkout set luci-app-openclash
          cd ..
          cp -r oc-src/luci-app-openclash package/luci-app-openclash
          rm -rf oc-src
          test -f package/luci-app-openclash/Makefile
          grep -m1 'PKG_VERSION' package/luci-app-openclash/Makefile

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-xg040gmd-oc-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            ponwrt-dl-xg040gmd-oc-
            ponwrt-dl-xg040gmd-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for Nokia XG-040G-MD + OpenClash
        run: |
          set -x
          cat > seed.config <<'SEED'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-proto-dhcp=y
          SEED
          ./scripts/kconfig.pl '+' seed.config configs/release.config > .config
          make defconfig
          # Package symbols keep the real hyphenated names (e.g. CONFIG_PACKAGE_dnsmasq-full).
          sed -i \
            -e 's|^CONFIG_PACKAGE_dnsmasq=y|# CONFIG_PACKAGE_dnsmasq is not set|' \
            -e 's|^# CONFIG_PACKAGE_dnsmasq-full is not set|CONFIG_PACKAGE_dnsmasq-full=y|' \
            -e 's|^# CONFIG_PACKAGE_dnsmasq_full_nftset is not set|CONFIG_PACKAGE_dnsmasq_full_nftset=y|' \
            -e 's|^# CONFIG_PACKAGE_dnsmasq_full_dnssec is not set|CONFIG_PACKAGE_dnsmasq_full_dnssec=y|' \
            -e 's|^# CONFIG_PACKAGE_luci-app-openclash is not set|CONFIG_PACKAGE_luci-app-openclash=y|' \
            -e 's|^# CONFIG_PACKAGE_luci-compat is not set|CONFIG_PACKAGE_luci-compat=y|' \
            -e 's|^# CONFIG_PACKAGE_ruby is not set|CONFIG_PACKAGE_ruby=y|' \
            -e 's|^# CONFIG_PACKAGE_ruby-yaml is not set|CONFIG_PACKAGE_ruby-yaml=y|' \
            -e 's|^# CONFIG_PACKAGE_kmod-tun is not set|CONFIG_PACKAGE_kmod-tun=y|' \
            -e 's|^# CONFIG_PACKAGE_kmod-inet-diag is not set|CONFIG_PACKAGE_kmod-inet-diag=y|' \
            -e 's|^# CONFIG_PACKAGE_kmod-nft-tproxy is not set|CONFIG_PACKAGE_kmod-nft-tproxy=y|' \
            .config
          if ! grep -q '^CONFIG_PACKAGE_dnsmasq-full=y' .config; then
            printf 'CONFIG_PACKAGE_dnsmasq-full=y\nCONFIG_DEFAULT_dnsmasq-full=y\nCONFIG_MODULE_DEFAULT_dnsmasq-full=y\n' >> .config
            sed -i 's|^CONFIG_DEFAULT_dnsmasq=y|# CONFIG_DEFAULT_dnsmasq is not set|; s|^CONFIG_MODULE_DEFAULT_dnsmasq=y|# CONFIG_MODULE_DEFAULT_dnsmasq is not set|' .config
          fi
          echo '=== config check ==='
          grep -E 'CONFIG_DEFAULT_dnsmasq|CONFIG_PACKAGE_dnsmasq|CONFIG_PACKAGE_luci-app-openclash|CONFIG_PACKAGE_luci-compat|CONFIG_PACKAGE_ruby' .config || true
          fail=0
          for sym in CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi CONFIG_PACKAGE_luci CONFIG_PACKAGE_dnsmasq-full CONFIG_PACKAGE_luci-app-openclash; do
            if ! grep -q "^${sym}=y" .config; then
              echo "::error::missing required symbol: ${sym}"
              fail=1
            fi
          done
          if grep -q '^CONFIG_PACKAGE_dnsmasq=y' .config; then
            echo '::error::plain dnsmasq still enabled, would conflict with dnsmasq-full'
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::config lines: $(grep -E 'dnsmasq|openclash|luci-compat|ruby' .config | tr '\n' '|' | cut -c1-1200)"
            exit 1
          fi

      - name: Download source tarballs
        run: |
          set -o pipefail
          make download -j"$(nproc)" 2>&1 | tee download.log

      - name: Report download failure
        if: failure()
        run: |
          echo "::error::download tail: $(tail -n 8 download.log | tr '\n' '|' | cut -c1-1200)"

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          echo "::error::build tail: $(tail -n 10 build.log | tr '\n' '|' | cut -c1-1200)"
          echo "::error::first errors: $(grep -iE '(^make[[:digit:]]*: \*\*\*|error:|failed)' build.log | head -n 6 | tr '\n' '|' | cut -c1-1200)"

      - name: Verify OpenClash is packed
        run: |
          ls -lh bin/targets/airoha/an7581/packages/ 2>/dev/null | grep -i openclash || \
            echo '::warning::openclash package not present in build output'

      - name: Collect images
        run: |
          mkdir -p release
          cp bin/targets/airoha/an7581/*.itb release/ 2>/dev/null || true
          cp bin/targets/airoha/an7581/*.bin release/ 2>/dev/null || true
          cp bin/targets/airoha/an7581/*.json release/ 2>/dev/null || true
          cp .config release/config.txt || true
          cd release && sha256sum * > sha256sums
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-xg040g-md-ubi-openclash-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: inputs.create_release != false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: xg040g-md-openclash-${{ github.run_number }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PonWrt XG-040G-MD + OpenClash $TAG" \
            --generate-notes
